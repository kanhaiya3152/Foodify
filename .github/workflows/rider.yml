name: Build & Push Rider Service

on:
  push:
    branches:
      - main
    paths:
      - "services/rider/**"

jobs:
  build-rider:
    name: Build & Push Rider Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push rider image
        uses: docker/build-push-action@v5
        with:
          context: ./services/rider
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/foodify-rider-service:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/foodify-rider-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Render Deploy
        run: curl -X POST ${{ secrets.RENDER_RIDER_DEPLOY_HOOK }}
        