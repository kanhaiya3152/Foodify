name: Build & Push Restaurant Service

on:
  push:
    branches:
      - main
    paths:
      - "services/restaurant/**"

jobs:
  build-restaurant:
    name: Build & Push Restaurant Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push restaurant image
        uses: docker/build-push-action@v5
        with:
          context: ./services/restaurant
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/foodify-restaurant:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/foodify-restaurant:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Render Deploy
        run: curl ${{ secrets.RENDER_RESTAURANT_DEPLOY_HOOK }}