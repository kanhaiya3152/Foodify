name: Build & Push Admin Service

on:
  push:
    branches:
      - main
    paths:
      - "services/admin/**"

jobs:
  build-admin:
    name: Build & Push Admin Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push admin image
        uses: docker/build-push-action@v5
        with:
          context: ./services/admin
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/foodify-admin-service:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/foodify-admin-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Render Deploy
        run: curl -X POST ${{ secrets.RENDER_ADMIN_DEPLOY_HOOK }}