name: Build & Push Realtime Service

on:
  push:
    branches:
      - main
    paths:
      - "services/realtime/**"

jobs:
  build-realtime:
    name: Build & Push Realtime Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push realtime image
        uses: docker/build-push-action@v5
        with:
          context: ./services/realtime
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/foodify-realtime-service:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/foodify-realtime-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Render Deploy
        run: curl -X POST ${{ secrets.RENDER_REALTIME_DEPLOY_HOOK }}